name: Validar kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sincronizar_skills.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verificar_pagina.py modelos/pagina-minima.html
